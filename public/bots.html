<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>机器人管理 · QQ Bridge</title>
<style>
:root{color-scheme:light;--bg:#f6f8fc;--card:#fff;--text:#202635;--muted:#697386;--line:#dfe5ee;--accent:#5268ec;--error:#b52239;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:30px 24px}header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:24px}.brand{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em}h1{font-size:27px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}p,.meta{color:var(--muted)}p{margin:0}.meta{font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}.bot-row{border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;margin:12px 0 5px}input,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card);color:var(--text);max-width:100%}input{width:100%;min-width:0}input[type=checkbox]{width:auto}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}a{color:var(--accent)}summary{cursor:pointer}.note{background:var(--soft);border-radius:9px;padding:12px;margin:14px 0}.message{min-height:1.7em;margin-top:12px;overflow-wrap:anywhere}.error{color:var(--error)}.success{color:#19754f}.bot-title{font-weight:700;font-size:16px;overflow-wrap:anywhere}.bot-state{border:1px solid var(--line);border-radius:20px;font-size:12px;padding:2px 9px;color:var(--muted)}input:focus,button:focus{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:700px){main{padding:20px 16px}.card{padding:18px}.fields{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111622;--card:#1b2232;--text:#e9edf7;--muted:#a8b3c7;--line:#354158;--accent:#9caaff;--error:#ff9bad;--soft:#27314e}button.primary{color:#131a30}}
</style></head><body><main>
<header><div><div class="brand">QQ BRIDGE / BOTS</div><h1>机器人管理</h1><p>连接多个机器人，在同一个后台切换管理。</p></div><div class="row"><a href="/">管理控制台</a><a href="/viewer">成员人设</a><button id="botsRefresh">刷新列表</button></div></header>
<section class="card"><h2>已连接的机器人</h2><div id="botsList"></div><div id="botsMessage" class="message meta" role="status"></div></section>
<details class="card" id="botAddPanel"><summary>添加机器人连接</summary><div class="note meta">连接已部署的本机机器人 Bridge。填写它的回环端口、QQ 号和机器令牌，保存后先核验身份，再启用连接。这里不会安装程序或操作服务器服务。</div>
<form id="botCreateForm"><div class="fields"><div><label for="botNewName">机器人名称</label><input id="botNewName" required maxlength="80" placeholder="例如：朋友群机器人"></div><div><label for="botNewId">机器人 ID（可留空自动生成）</label><input id="botNewId" pattern="[a-z0-9][a-z0-9-]{0,63}" maxlength="64" placeholder="例如：friends-bot"></div><div><label for="botNewQQ">预期 QQ 号</label><input id="botNewQQ" required inputmode="numeric" pattern="[0-9]+" placeholder="该机器人登录的 QQ"></div><div><label for="botNewPort">本机 Bridge 端口</label><input id="botNewPort" type="number" required min="1" max="65535" placeholder="例如：3101"></div><div><label for="botNewToken">机器访问令牌</label><input id="botNewToken" type="password" autocomplete="new-password" required minlength="16" maxlength="128" pattern="[A-Za-z0-9_-]+" placeholder="16—128 位字母、数字、下划线或短横线"></div></div><div class="row" style="margin-top:16px"><button id="botCreate" class="primary">保存为未启用连接</button><span class="meta">令牌由服务端保存，页面不会回显。</span></div><div id="botCreateMessage" class="message meta" role="status"></div></form></details>
</main><script>
const $ = id => document.getElementById(id);
async function api(route, body) { const headers = body === undefined ? {} : { 'content-type': 'application/json' }; const response = await fetch(route, { method: body === undefined ? 'GET' : 'POST', credentials: 'same-origin', headers, ...(body === undefined ? {} : { body: JSON.stringify(body) }) }); if (response.status === 401) { location.replace('/login'); throw new Error('登录已过期'); } let data; try { data = await response.json(); } catch { throw new Error('服务暂不可用，请稍后重试'); } if (!response.ok || !data.ok) throw new Error(data.error || '操作失败'); return data; }
function field(parent, title, value, options = {}) { const label = document.createElement('label'), input = document.createElement('input'); label.textContent = title; input.value = value || ''; input.type = options.type || 'text'; Object.assign(input, options); label.appendChild(input); parent.appendChild(label); return input; }
function setMessage(el, text, error) { el.textContent = text; el.className = 'message ' + (error ? 'error' : 'success'); }
function botRoute(id, action) { return '/api/bots/' + encodeURIComponent(id) + '/' + action; }
async function loadBots() {
  const msg = $('botsMessage'); msg.textContent = '正在读取…'; msg.className = 'message meta';
  try { const data = await api('/api/bots'), box = $('botsList'); box.replaceChildren();
    for (const bot of data.bots || []) {
      const item = document.createElement('article'); item.className = 'bot-row'; item.dataset.botId = bot.id;
      const row = document.createElement('div'); row.className = 'row'; const title = document.createElement('span'); title.className = 'bot-title'; title.textContent = bot.name;
      const badge = document.createElement('span'); badge.className = 'bot-state'; badge.textContent = bot.isPrimary ? '主机器人' : bot.enabled ? '已启用' : '未启用'; row.append(title, badge);
      const info = document.createElement('div'); info.className = 'meta'; info.textContent = 'ID：' + bot.id + ' · 预期 QQ：' + (bot.expectedQQ || '未设置') + ' · 实际 QQ：' + (bot.actualQQ || '未核验') + (bot.isPrimary ? '' : ' · 端口：' + bot.port) + ' · 核验时间：' + (bot.verifiedAt ? new Date(bot.verifiedAt).toLocaleString('zh-CN') : '尚未核验');
      const actions = document.createElement('div'); actions.className = 'row'; actions.style.marginTop = '12px';
      if (bot.isPrimary || bot.enabled) { const link = document.createElement('a'); link.href = '/?bot=' + encodeURIComponent(bot.id); link.textContent = '打开管理控制台'; actions.appendChild(link); }
      item.append(row, info, actions); box.appendChild(item);
      if (bot.isPrimary) continue;
      const form = document.createElement('form'), fields = document.createElement('div'); fields.className = 'fields';
      const name = field(fields, '机器人名称', bot.name, { required: true, maxLength: 80 });
      const qq = field(fields, '预期 QQ 号', bot.expectedQQ, { required: true, pattern: '[0-9]+', inputMode: 'numeric' });
      const port = field(fields, '本机 Bridge 端口', String(bot.port || ''), { type: 'number', required: true, min: '1', max: '65535' });
      const token = field(fields, '更换机器令牌（留空保持原值）', '', { type: 'password', autocomplete: 'new-password', minLength: 16, maxLength: 128, pattern: '[A-Za-z0-9_-]+' });
      const controls = document.createElement('div'); controls.className = 'row'; controls.style.marginTop = '12px';
      const enabledLabel = document.createElement('label'), enabled = document.createElement('input'); enabled.type = 'checkbox'; enabled.checked = !!bot.enabled; enabledLabel.append(enabled, document.createTextNode(' 启用连接（服务端将再次核验身份）'));
      const save = document.createElement('button'); save.textContent = '保存连接'; save.type = 'submit'; save.setAttribute('aria-label', '保存机器人 ' + bot.id);
      const verify = document.createElement('button'); verify.textContent = '核验 QQ 身份'; verify.type = 'button'; verify.setAttribute('aria-label', '核验机器人 ' + bot.id);
      const remove = document.createElement('button'); remove.textContent = '移除连接'; remove.type = 'button'; remove.disabled = !!bot.enabled; remove.title = bot.enabled ? '请先停用连接再移除' : '仅移除后台连接记录';
      const result = document.createElement('div'); result.className = 'message meta'; result.setAttribute('role', 'status'); controls.append(enabledLabel, save, verify, remove); form.append(fields, controls, result); item.appendChild(form);
      async function run(action, body, success) { save.disabled = true; verify.disabled = true; remove.disabled = true; setMessage(result, '正在处理…', false); try { await api(botRoute(bot.id, action), body); token.value = ''; await loadBots(); setMessage($('botsMessage'), success, false); } catch (error) { setMessage(result, error.message, true); save.disabled = false; verify.disabled = false; remove.disabled = !!bot.enabled; } }
      form.addEventListener('submit', event => { event.preventDefault(); const body = { name: name.value.trim(), expectedQQ: qq.value.trim(), port: Number(port.value), enabled: enabled.checked }; if (token.value) body.machineToken = token.value; run('update', body, '连接已保存。'); });
      verify.addEventListener('click', () => run('verify', {}, 'QQ 身份核验通过。需要使用时再勾选启用并保存。'));
      remove.addEventListener('click', () => { if (confirm('确认移除这个已停用的机器人连接？其聊天和人设数据仍保留。')) run('delete', {}, '连接已移除，机器人自身的数据仍保留。'); });
    }
    msg.textContent = '共 ' + (data.bots || []).length + ' 个机器人。机器令牌不会回显。';
  } catch (error) { setMessage(msg, error.message, true); }
}
$('botsRefresh').addEventListener('click', loadBots);
$('botCreateForm').addEventListener('submit', async event => { event.preventDefault(); const button = $('botCreate'), msg = $('botCreateMessage'); button.disabled = true; try { const body = { name: $('botNewName').value.trim(), expectedQQ: $('botNewQQ').value.trim(), port: Number($('botNewPort').value), machineToken: $('botNewToken').value, enabled: false }; if ($('botNewId').value.trim()) body.id = $('botNewId').value.trim(); await api('/api/bots', body); $('botCreateForm').reset(); setMessage(msg, '连接已添加。请先核验 QQ 身份，再启用。', false); await loadBots(); } catch (error) { setMessage(msg, error.message, true); } finally { button.disabled = false; } });
loadBots();
</script></body></html>
